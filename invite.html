<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#21171c"/>
  <meta name="robots" content="noindex"/>
  <title>Shankar Prasad &amp; Haripriya — Invitation</title>
  <link rel="stylesheet" href="styles/music-shell.css"/>
  <script src="js/music.js" defer></script>
  <script src="js/music-shell.js" defer></script>
</head>
<body>
  <iframe id="invitation-frame" title="Wedding and reception invitation" allow="autoplay; web-share; clipboard-write" hidden></iframe>
  <audio id="invitation-music" src="assets/invitation-music.mp3" loop preload="none"></audio>
  <div class="music-bar" hidden>
    <button id="music-toggle" type="button" aria-controls="invitation-music" aria-pressed="false" aria-label="Play music">
      <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
      <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    </button>
    <span id="music-status" class="sr-only" role="status" aria-live="polite">Music is off</span>
  </div>
  <noscript><p><a href="index.html">Open the invitation</a> — music requires JavaScript.</p></noscript>
</body>
</html>
