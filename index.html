<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shankar Prasad & Haripriya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0508;font-family:'Cormorant Garamond',Georgia,serif;color:#FFF8E7;-webkit-font-smoothing:antialiased;}

/* ══ BACKGROUND PHOTO ══ */
.bg-photo{
  position:fixed;inset:-3%;
  background-image:url('assets/temple-sunset.jpg');
  background-size:cover;
  background-position:center 62%;
  animation:kenburns 34s ease-in-out infinite alternate;
  z-index:0;
}
@keyframes kenburns{
  0%{transform:scale(1) translate(0,0);}
  100%{transform:scale(1.1) translate(-1%,-1%);}
}
.bg-tint{
  position:fixed;inset:0;z-index:1;
  background:
    linear-gradient(180deg, rgba(10,5,10,0.55) 0%, rgba(20,8,14,0.35) 30%, rgba(30,10,10,0.55) 65%, rgba(8,4,6,0.92) 100%),
    radial-gradient(ellipse at 50% 40%, rgba(80,30,20,0.15) 0%, transparent 60%);
}
.bg-vignette{
  position:fixed;inset:0;z-index:2;
  background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
  pointer-events:none;
}

canvas#sparkle-canvas{position:fixed;inset:0;z-index:3;pointer-events:none;}

/* ══ SWAYING FOREGROUND PALMS ══ */
.palm{
  position:fixed;bottom:0;z-index:4;
  height:clamp(240px,42vh,440px);width:auto;
  pointer-events:none;opacity:0.95;
  filter:drop-shadow(0 0 5px rgba(255,160,70,0.35));
}
.palm-l{left:-4px;}
.palm-r{right:-4px;transform:scaleX(-1);}
.frond{transform-box:view-box;transform-origin:100px 120px;animation:sway 4s ease-in-out infinite alternate;}
.f1{animation-duration:4.3s;animation-delay:-0.2s;}
.f2{animation-duration:3.7s;animation-delay:-1.4s;}
.f3{animation-duration:4.9s;animation-delay:-0.8s;}
.f4{animation-duration:4.0s;animation-delay:-2.1s;}
.f5{animation-duration:4.6s;animation-delay:-0.5s;}
@keyframes sway{0%{transform:rotate(-3.5deg);}100%{transform:rotate(3.5deg);}}
@media (prefers-reduced-motion: reduce){
  .frond{animation:none;}
}

/* ══ CONTENT ══ */
.landing{
  position:relative;z-index:5;
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:20px;
  opacity:0;
  animation:riseIn 1.6s ease 0.3s forwards;
}
@keyframes riseIn{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}

.crest{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(36px,5.5vw,50px);
  line-height:1;
  margin-bottom:8px;
  background:linear-gradient(180deg,#FFF3D4 0%,#F5D078 50%,#C9A05C 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,200,80,0.45));
  opacity:0.95;
}
.eyebrow{
  font-family:'Cinzel',serif;
  font-size:clamp(10px,1.3vw,13px);
  letter-spacing:0.32em;
  text-transform:uppercase;
  color:rgba(230,195,130,0.75);
  margin-bottom:18px;
}
.couple-names{
  font-family:'Great Vibes',cursive;
  font-weight:400;
  font-size:clamp(40px,8vw,84px);
  line-height:1.15;
  background:linear-gradient(180deg,#FFF3D4 0%,#F5D078 45%,#D4AF37 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 18px rgba(255,190,80,0.35));
  max-width:90vw;
}
.couple-names .amp{
  display:inline-block;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:300;
  font-size:0.55em;
  margin:0 0.15em;
  vertical-align:0.1em;
  color:rgba(245,208,120,0.85);
  -webkit-text-fill-color:rgba(245,208,120,0.85);
}
.landing-date{
  margin-top:14px;
  font-size:clamp(13px,1.6vw,16px);
  letter-spacing:0.14em;
  color:rgba(255,235,205,0.78);
  font-variant-numeric:tabular-nums;
}
.landing-date .dot{color:rgba(212,175,55,0.6);margin:0 8px;}

/* ══ COUNTDOWN ══ */
#countdown{
  display:flex;align-items:flex-start;justify-content:center;
  gap:clamp(10px,2.4vw,22px);
  margin-top:clamp(18px,3vh,28px);
}
.cd-unit{display:flex;flex-direction:column;align-items:center;min-width:38px;}
.cd-num{
  font-family:'Cinzel',serif;font-weight:600;
  font-size:clamp(22px,3.8vw,34px);
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#FFF3D4 0%,#F5D078 55%,#C9A05C 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1;
  filter:drop-shadow(0 0 8px rgba(255,200,80,0.3));
}
.cd-label{
  font-family:'Cinzel',serif;font-size:clamp(8px,1vw,10px);
  letter-spacing:0.18em;text-transform:uppercase;
  color:rgba(232,205,160,0.55);margin-top:5px;
}
.cd-sep{
  font-family:'Cinzel',serif;font-size:clamp(16px,2.6vw,24px);
  color:rgba(212,175,55,0.32);
  align-self:center;
  transform:translateY(-7px);
}
.cd-done{
  font-family:'Cinzel',serif;font-size:clamp(13px,1.8vw,16px);
  letter-spacing:0.14em;text-transform:uppercase;
  color:#F5D078;
  text-shadow:0 0 12px rgba(255,200,80,0.5);
}
@media (max-width:420px){
  #countdown{gap:8px;}
  .cd-unit{min-width:30px;}
}

/* ══ PORTAL CARDS ══ */
.portal-row{
  display:flex;
  gap:clamp(16px,3vw,36px);
  margin-top:clamp(36px,6vh,56px);
  flex-wrap:wrap;
  justify-content:center;
}
.portal-card{
  --acc:#D4AF37;
  position:relative;
  width:min(240px,40vw);
  min-width:180px;
  padding:clamp(26px,3.4vw,36px) 18px 24px;
  background:linear-gradient(160deg,rgba(40,20,20,0.42),rgba(20,10,14,0.58));
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(212,175,55,0.32);
  border-radius:4px;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
  transition:transform 0.45s cubic-bezier(.2,.8,.2,1), border-color 0.4s, box-shadow 0.4s, background 0.4s;
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
}
.portal-card:nth-child(2){--acc:#E8C39E;}
.portal-card::before{
  content:'';
  position:absolute;inset:6px;
  border:1px solid rgba(212,175,55,0.16);
  border-radius:2px;
  pointer-events:none;
}
.portal-card:hover{
  transform:translateY(-8px);
  border-color:rgba(212,175,55,0.75);
  box-shadow:0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(212,175,55,0.18);
  background:linear-gradient(160deg,rgba(50,26,24,0.55),rgba(24,12,16,0.68));
}
.portal-icon{
  width:100%;
  display:flex;justify-content:center;
  margin-bottom:16px;
  color:var(--acc);
  filter:drop-shadow(0 0 10px rgba(212,175,55,0.3));
}
.portal-icon svg{width:clamp(38px,5vw,50px);height:auto;overflow:visible;}
.portal-card h2{
  font-family:'Cinzel',serif;
  font-weight:500;
  font-size:clamp(15px,1.8vw,19px);
  letter-spacing:0.08em;
  color:#FFF3D4;
  margin-bottom:6px;
}
.portal-card p{
  font-size:clamp(11px,1.3vw,13px);
  font-style:italic;
  color:rgba(255,230,195,0.62);
  letter-spacing:0.03em;
}
.portal-arrow{
  margin-top:14px;
  font-size:11px;
  letter-spacing:0.2em;
  color:rgba(212,175,55,0.55);
  text-transform:uppercase;
  transition:color 0.3s, letter-spacing 0.3s;
}
.portal-card:hover .portal-arrow{color:rgba(255,220,150,0.9);letter-spacing:0.32em;}

@media (max-width:520px){
  .portal-row{flex-direction:column;align-items:center;}
  .portal-card{width:min(280px,80vw);}
}

/* focus visibility for keyboard users */
a:focus-visible, [tabindex]:focus-visible{
  outline:2px solid rgba(255,220,150,0.85);
  outline-offset:3px;
  border-radius:2px;
}

.share-btn{
  margin-top:22px;
  background:none;border:none;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;
  color:rgba(232,205,160,0.6);cursor:pointer;
  padding:6px 10px;transition:color 0.3s;
}
.share-btn:hover{color:#F5D078;}

/* ══ LOADER ══ */
#loader{
  position:fixed;inset:0;z-index:100;
  background:#0a0508;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 0.5s ease;
}
#loader .l-om{
  font-family:'Cormorant Garamond',serif;font-size:44px;
  background:linear-gradient(180deg,#FFF3D4,#D4AF37);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:loaderPulse 1.6s ease-in-out infinite;
}
#loader .l-names{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.3em;color:rgba(232,205,160,0.6);margin-top:14px;text-transform:uppercase;}
@keyframes loaderPulse{0%,100%{opacity:0.5;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}

@media (prefers-reduced-motion: reduce){
  .bg-photo{animation:none;}
  .landing{animation:none;opacity:1;transform:none;}
  #loader .l-om{animation:none;}
}
</style>
</head>
<body>

<div id="loader"><div class="l-om">ௐ</div><div class="l-names">Shankar &amp; Haripriya</div></div>

<div class="bg-photo"></div>
<div class="bg-tint"></div>
<canvas id="sparkle-canvas"></canvas>
<div class="bg-vignette"></div>

<svg class="palm palm-l" viewBox="0 0 200 430" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M100,430 Q90,300 108,200 Q115,155 100,120" stroke="#140d10" stroke-width="10" fill="none" stroke-linecap="round"/>
  <g class="frond f1"><path d="M100,120 Q35,100 8,145" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g class="frond f2"><path d="M100,120 Q55,60 22,45" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g class="frond f3"><path d="M100,120 Q100,40 88,5" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g class="frond f4"><path d="M100,120 Q145,60 178,45" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g class="frond f5"><path d="M100,120 Q165,100 192,145" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
</svg>
<svg class="palm palm-r" viewBox="0 0 200 430" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M100,430 Q90,300 108,200 Q115,155 100,120" stroke="#140d10" stroke-width="10" fill="none" stroke-linecap="round"/>
  <g class="frond f2"><path d="M100,120 Q35,100 8,145" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g class="frond f4"><path d="M100,120 Q55,60 22,45" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g class="frond f1"><path d="M100,120 Q100,40 88,5" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g class="frond f5"><path d="M100,120 Q145,60 178,45" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g class="frond f3"><path d="M100,120 Q165,100 192,145" stroke="#1a1214" stroke-width="8" fill="none" stroke-linecap="round"/></g>
</svg>

<main class="landing">
  <div class="crest">ௐ</div>
  <p class="eyebrow">Together with their families</p>
  <h1 class="couple-names">Shankar Prasad<span class="amp">&amp;</span>Haripriya</h1>
  <p class="landing-date">FRIDAY <span class="dot">·</span> 20 NOVEMBER 2026 <span class="dot">·</span> COIMBATORE</p>

  <div id="countdown">
    <div class="cd-unit"><span class="cd-num" id="cd-days">00</span><span class="cd-label">Days</span></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><span class="cd-num" id="cd-hours">00</span><span class="cd-label">Hrs</span></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><span class="cd-num" id="cd-mins">00</span><span class="cd-label">Min</span></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><span class="cd-num" id="cd-secs">00</span><span class="cd-label">Sec</span></div>
  </div>

  <button class="share-btn" onclick="shareInvite()">⤴ Share this invitation</button>

  <div class="portal-row">
    <a class="portal-card" href="wedding.html">
      <div class="portal-icon">
        <svg viewBox="0 0 60 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 2 L34 10 L26 10 Z" fill="currentColor"/>
          <path d="M22 14 L38 14 L34 24 L26 24 Z" fill="currentColor" opacity="0.85"/>
          <path d="M16 28 L44 28 L38 40 L22 40 Z" fill="currentColor" opacity="0.7"/>
          <path d="M10 44 L50 44 L44 54 L16 54 Z" fill="currentColor" opacity="0.55"/>
          <rect x="22" y="54" width="6" height="8" fill="currentColor" opacity="0.5"/>
          <rect x="32" y="54" width="6" height="8" fill="currentColor" opacity="0.5"/>
          <line x1="6" y1="62" x2="54" y2="62" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
        </svg>
      </div>
      <h2>Wedding Ceremony</h2>
      <p>The Sacred Rites</p>
      <div class="portal-arrow">Enter →</div>
    </a>

    <a class="portal-card" href="reception.html">
      <div class="portal-icon">
        <svg viewBox="0 0 60 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6 L22 26 Q22 34 30 34 Q38 34 38 26 L42 6 Z" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="30" y1="34" x2="30" y2="52" stroke="currentColor" stroke-width="2"/>
          <line x1="18" y1="52" x2="42" y2="52" stroke="currentColor" stroke-width="2"/>
          <path d="M14 10 L18 14 M46 10 L42 14" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
          <circle cx="12" cy="8" r="1.6" fill="currentColor" opacity="0.8"/>
          <circle cx="48" cy="14" r="1.6" fill="currentColor" opacity="0.8"/>
          <circle cx="8" cy="18" r="1.2" fill="currentColor" opacity="0.6"/>
        </svg>
      </div>
      <h2>Reception</h2>
      <p>An Evening Celebration</p>
      <div class="portal-arrow">Enter →</div>
    </a>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/features.js"></script>
<script>
initLoader();

/* Countdown to the wedding muhurtham — reuses the same UTC timestamp
   stored in config.js for the calendar export, so the two never drift. */
(function(){
  function parseICSUTC(s){
    const y=+s.slice(0,4), mo=+s.slice(4,6)-1, d=+s.slice(6,8);
    const h=+s.slice(9,11), mi=+s.slice(11,13), se=+s.slice(13,15);
    return Date.UTC(y,mo,d,h,mi,se);
  }
  const target = parseICSUTC(WEDDING_CONFIG.wedding.icsStartUTC);
  const cd = document.getElementById('countdown');
  const els = {
    d: document.getElementById('cd-days'),
    h: document.getElementById('cd-hours'),
    m: document.getElementById('cd-mins'),
    s: document.getElementById('cd-secs')
  };
  function pad(n){ return String(n).padStart(2,'0'); }
  let iv;
  function tick(){
    const diff = target - Date.now();
    if(diff <= 0){
      cd.innerHTML = '<div class="cd-done">✦ They&rsquo;re Married! ✦</div>';
      clearInterval(iv);
      return;
    }
    const totalSec = Math.floor(diff/1000);
    els.d.textContent = Math.floor(totalSec/86400);
    els.h.textContent = pad(Math.floor((totalSec%86400)/3600));
    els.m.textContent = pad(Math.floor((totalSec%3600)/60));
    els.s.textContent = pad(totalSec%60);
  }
  tick();
  iv = setInterval(tick, 1000);
})();

const cv = document.getElementById('sparkle-canvas');
const cx = cv.getContext('2d');
function mkSpark(rand){
  return {
    x:Math.random(), y: rand?Math.random():1.05,
    vy:0.00035+Math.random()*0.0006,
    vx:(Math.random()-0.5)*0.00018,
    r:0.6+Math.random()*1.6,
    a:0.2+Math.random()*0.55,
    ph:Math.random()*Math.PI*2, sp:0.5+Math.random()*1.2
  };
}
const SPARKS = Array.from({length:70}, ()=>mkSpark(true));

/* Distant birds crossing the sunset sky, wings flapping */
function mkBird(rand){
  const dir = Math.random()<0.5 ? 1 : -1;
  return {
    x: rand ? Math.random() : (dir>0 ? -0.08 : 1.08),
    y: 0.06 + Math.random()*0.4,
    vx: dir*(0.00028 + Math.random()*0.00035),
    bob: Math.random()*Math.PI*2,
    bobSp: 0.4+Math.random()*0.5,
    flapPh: Math.random()*Math.PI*2,
    flapSp: 3.2+Math.random()*1.8,
    size: 3.5+Math.random()*5,
    dir
  };
}
const BIRDS = Array.from({length:6}, ()=>mkBird(true));

function drawBird(b,W,H,tt){
  const x = b.x*W, y = (b.y + Math.sin(tt*b.bobSp+b.bob)*0.01)*H;
  const flap = Math.sin(tt*b.flapSp+b.flapPh);
  const s = b.size;
  cx.strokeStyle = 'rgba(35,22,26,0.62)';
  cx.lineWidth = Math.max(1, s*0.22);
  cx.lineCap = 'round';
  cx.beginPath();
  cx.moveTo(x - s*b.dir, y - flap*s*0.7);
  cx.quadraticCurveTo(x - s*0.35*b.dir, y - flap*s*0.15, x, y);
  cx.quadraticCurveTo(x + s*0.35*b.dir, y - flap*s*0.15, x + s*b.dir, y - flap*s*0.7);
  cx.stroke();
}

let t=0;
function loop(){
  cv.width=innerWidth; cv.height=innerHeight;
  const W=cv.width,H=cv.height; t+=0.02;
  for(const s of SPARKS){
    s.y-=s.vy; s.x+=s.vx;
    if(s.y<-0.02) Object.assign(s, mkSpark(false));
    const tw = 0.5+0.5*Math.sin(t*s.sp+s.ph);
    cx.beginPath();
    cx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    cx.fillStyle=`rgba(255,222,150,${s.a*tw})`;
    cx.fill();
  }
  for(const b of BIRDS){
    b.x += b.vx;
    if(b.x < -0.1 || b.x > 1.1) Object.assign(b, mkBird(false));
    drawBird(b,W,H,t);
  }
  requestAnimationFrame(loop);
}
if(!prefersReducedMotion) loop();
else { cv.width=innerWidth; cv.height=innerHeight; }
</script>
</body>
