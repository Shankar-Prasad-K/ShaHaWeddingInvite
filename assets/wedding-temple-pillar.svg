  <path d="M48 103H142V691H48Z" fill="#815827" stroke="#4c2e12" stroke-width="2"/>
  <rect x="49" y="105" width="18" height="578" fill="url(#vine)"/>
  <rect x="123" y="105" width="18" height="578" fill="url(#vine)"/>
  <path d="M43 103L49 692M147 103L141 692M69 104V687M121 104V687" stroke="#edcc88" stroke-width=".6"/>
  <rect x="70" y="103" width="50" height="106" rx="23" fill="url(#recess)" stroke="#d2aa61"/>
  <use href="#lotus" transform="translate(95 172) scale(.63)"/>
  <path d="M95 180V196M85 187Q95 182 105 187" stroke="#cfaa67"/>
  <use href="#band" transform="translate(0 218)"/>
