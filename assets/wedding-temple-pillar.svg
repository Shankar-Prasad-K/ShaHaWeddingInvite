      <path d="M-18 8Q-40 9 -38 -10Q-46 -22 -40 -26Q-32 -28 -31 -13L-17 -3M18 8Q40 9 38 -10Q46 -22 40 -26Q32 -28 31 -13L17 -3" fill="url(#gold)"/>
      <path d="M-40 -23V-35M40 -23V-35" stroke="#d8b56f" stroke-width="2"/>
      <use href="#lotus" transform="translate(-40 -35) scale(.24)"/><use href="#lotus" transform="translate(40 -35) scale(.24)"/>
      <!-- Seated legs and rounded torso. -->
      <path d="M-14 35C-38 31 -54 45 -43 55C-33 63 -9 55 0 52C9 55 33 63 43 55C54 45 38 31 14 35Z" fill="url(#gold)"/>
      <path d="M-25 0Q-31 15 -24 35Q-13 53 0 49Q13 53 24 35Q31 15 25 0Z" fill="url(#gold)"/>
      <path d="M-16 14Q0 24 16 14M-20 33Q0 43 20 33M-31 46Q-19 40 -9 47M31 46Q19 40 9 47" fill="none"/>
      <path d="M-20 28Q0 36 20 28" stroke="#f0d497" stroke-width="2"/>
      <circle cy="30" r="2.5" fill="#795022"/>
