  <path d="M41 274Q43 256 64 253Q95 224 126 253Q147 256 149 274V431H41Z" fill="url(#moulding)" stroke="#e3c283"/>
  <path d="M47 278Q50 263 68 261Q95 237 122 261Q140 263 143 278V421H47Z" fill="url(#recess)" stroke="#4c2d11" stroke-width="2"/>
  <path d="M48 413V279Q49 262 68 261Q95 237 122 261Q141 262 142 279V413" stroke="#d8b775" stroke-width="3" stroke-dasharray="1 4"/>
  <use href="#ganesha" transform="translate(95 342) scale(.9)"/>
  <use href="#band" transform="translate(0 431)"/>
  <!-- Interlaced floral medallion and leaf-cut shaft panels. -->
  <rect x="70" y="467" width="50" height="108" rx="23" fill="url(#recess)" stroke="#d5b06e"/>
  <path d="M95 473C61 493 126 531 95 568C126 548 61 510 95 473Z" fill="none" stroke="#cea761" stroke-width="1.5"/>
  <use href="#rosette" transform="translate(95 521) scale(1.1)"/>
  <use href="#band" transform="translate(0 586)"/>
