  <use href="#rosette" transform="translate(95 739) scale(.65)"/><use href="#rosette" transform="translate(121 739) scale(.65)"/><use href="#rosette" transform="translate(147 739) scale(.65)"/>
  <path d="M17 756H173V767H17ZM10 770H180V783H10Z" fill="url(#moulding)" stroke="#e0bb77" stroke-width=".7"/>
  <path d="M12 787H178" stroke="#563312" stroke-width="4"/>
</svg>