<svg xmlns="http://www.w3.org/2000/svg" width="190" height="800" viewBox="0 0 190 800" fill="none">
  <title>Temple-inspired carved pillar with a seated Ganesha relief</title>
  <defs>
    <linearGradient id="stone" x1="20" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38200e"/><stop offset=".13" stop-color="#95652e"/><stop offset=".3" stop-color="#d6af68"/><stop offset=".47" stop-color="#ae803d"/><stop offset=".67" stop-color="#c59b54"/><stop offset=".87" stop-color="#72481f"/><stop offset="1" stop-color="#321c0c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#fff0bd"/><stop offset=".25" stop-color="#e5c584"/><stop offset=".58" stop-color="#bd924c"/><stop offset=".84" stop-color="#8f602b"/><stop offset="1" stop-color="#d9b46d"/>
    </linearGradient>
    <linearGradient id="moulding" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f9dda2"/><stop offset=".16" stop-color="#c29851"/><stop offset=".45" stop-color="#9a6b31"/><stop offset=".75" stop-color="#cba562"/><stop offset="1" stop-color="#38200e"/>
    </linearGradient>
    <radialGradient id="recess"><stop stop-color="#6a441f"/><stop offset=".7" stop-color="#3e2412"/><stop offset="1" stop-color="#24150b"/></radialGradient>
    <filter id="relief" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="1.3" dy="2" stdDeviation=".85" flood-color="#160c05" flood-opacity=".9"/></filter>
    <pattern id="beads" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.6" fill="#6b451e"/><circle cx="4.6" cy="4.1" r="2" fill="url(#gold)"/></pattern>
    <pattern id="vine" width="18" height="52" patternUnits="userSpaceOnUse">
      <path d="M9 0C-2 13 20 30 9 52" stroke="#41290f" stroke-width="2"/>
      <path d="M8 0C-3 13 19 30 8 52M8 16C0 17 0 7 3 7C9 8 11 12 8 16ZM10 34C18 33 18 23 15 23C9 24 7 29 10 34Z" stroke="#d1ad6a" stroke-width=".8" fill="#b18443"/>
    </pattern>
    <g id="petal" fill="url(#gold)" stroke="#694519" stroke-width=".7"><path d="M0 0C-10 -9 -10 -23 0 -34C10 -23 10 -9 0 0Z"/><path d="M0 -5V-28" stroke="#f1d598" stroke-width=".7"/></g>
    <g id="lotus" filter="url(#relief)">
      <use href="#petal" transform="rotate(-65)"/><use href="#petal" transform="rotate(65)"/>
      <use href="#petal" transform="rotate(-34)"/><use href="#petal" transform="rotate(34)"/><use href="#petal"/>
      <path d="M-32 0Q0 19 32 0Q0 6 -32 0Z" fill="url(#gold)" stroke="#6c461f"/>
      <path d="M-27 4Q0 18 27 4" stroke="#e3c384"/>
    </g>
    <g id="rosette" fill="url(#gold)" stroke="#68421b" stroke-width=".65">
      <use href="#petal" transform="scale(.38)"/><use href="#petal" transform="rotate(45) scale(.38)"/>
      <use href="#petal" transform="rotate(90) scale(.38)"/><use href="#petal" transform="rotate(135) scale(.38)"/>
      <use href="#petal" transform="rotate(180) scale(.38)"/><use href="#petal" transform="rotate(225) scale(.38)"/>
      <use href="#petal" transform="rotate(270) scale(.38)"/><use href="#petal" transform="rotate(315) scale(.38)"/>
      <circle r="4"/><circle r="1.6" fill="#f7dda0"/>
    </g>
    <g id="band">
      <rect x="32" width="126" height="24" rx="2" fill="url(#moulding)" stroke="#3d260f"/>
      <path d="M34 3H156M34 21H156" stroke="#f0d293" stroke-width=".8"/>
      <path d="M38 12L45 5L52 12L45 19ZM58 12L65 5L72 12L65 19ZM78 12L85 5L92 12L85 19ZM98 12L105 5L112 12L105 19ZM118 12L125 5L132 12L125 19ZM138 12L145 5L152 12L145 19Z" fill="#6b451e" stroke="#d2ad66" stroke-width=".8"/>
      <path d="M42 12H48M62 12H68M82 12H88M102 12H108M122 12H128M142 12H148" stroke="#e8c987" stroke-width="1.6"/>
    </g>
    <!-- Original stylised bas-relief, not a reproduction of a temple sculpture. -->
    <g id="ganesha" stroke="#654019" stroke-width="1.1" stroke-linejoin="round" filter="url(#relief)">
      <circle cy="-16" r="43" fill="none" stroke="#ae8443" stroke-width="3"/>
      <circle cy="-16" r="38" fill="none" stroke="#e1be78" stroke-width=".8" stroke-dasharray="1 3"/>
