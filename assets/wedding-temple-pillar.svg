  <rect x="17" y="12" width="156" height="10" rx="2" fill="url(#moulding)"/>
  <rect x="24" y="72" width="142" height="12" rx="2" fill="url(#moulding)"/>
  <rect x="35" y="84" width="120" height="10" fill="url(#beads)"/>
