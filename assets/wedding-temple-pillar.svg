      <path d="M-22 2Q-34 7 -30 21L-35 28Q-43 25 -40 15L-37 8Q-33 1 -31 -1Z" fill="url(#gold)"/>
      <path d="M-37 12L-37 23M-34 12L-34 20" fill="none" stroke-width=".6"/>
      <path d="M22 2Q35 9 31 21L38 25Q43 31 34 32Q21 32 22 19Z" fill="url(#gold)"/>
      <path d="M28 24Q36 36 44 24Z" fill="url(#gold)"/><path d="M32 24Q36 14 40 24Z" fill="#f1ce83"/>
      <!-- Elephant ears, head and curled trunk. -->
      <path d="M-15 -33C-48 -49 -48 -7 -21 0L-13 -13M15 -33C48 -49 48 -7 21 0L13 -13" fill="url(#gold)"/>
      <path d="M-24 -30Q-39 -33 -33 -17L-24 -9M24 -30Q39 -33 33 -17L24 -9" fill="none" stroke="#e5c382"/>
      <path d="M0 -45C-23 -45 -26 -27 -20 -10Q-15 2 -6 2C-8 13 -4 25 9 25C22 25 23 13 17 10Q11 8 11 15Q2 18 5 3C24 -2 26 -28 17 -38Q9 -45 0 -45Z" fill="url(#gold)"/>
      <path d="M-17 -11L-13 0L-10 -9M13 -10L17 -3L18 -13" fill="#f5d99c"/>
      <path d="M-15 -22Q-11 -25 -7 -22M7 -22Q11 -25 15 -22" fill="none" stroke="#513214" stroke-width="1.7"/>
      <path d="M-3 -12Q-6 5 -1 13" stroke="#f4d79c" fill="none"/>
      <path d="M-3 -31H3M-3 -28H3M0 -35V-25" stroke="#6b441e" stroke-width=".8"/>
      <!-- Tiered crown and necklace with individually cut beads. -->
      <path d="M-19 -39L-14 -49H14L19 -39Z M-14 -49L-9 -58H9L14 -49Z M-9 -58L0 -69L9 -58Z" fill="url(#gold)"/>
      <path d="M-17 -42H17M-11 -52H11M-6 -60H6" stroke="#ffe5ad" stroke-width=".8"/>
      <circle cy="-65" r="1.8" fill="#f9de9e"/>
      <path d="M-18 0Q0 14 18 0" stroke="#edcc88" stroke-width="3" stroke-dasharray="1 3" fill="none"/>
      <path d="M-4 10L0 15L4 10L0 7Z" fill="#f5d799"/>
      <path d="M-43 58Q0 64 43 58L38 66H-38Z" fill="url(#moulding)"/>
    </g>
  </defs>
  <!-- Broad carved capital, a single solid shaft, and a stepped stone base. -->
  <path d="M37 19H153L172 49L157 72H33L18 49Z" fill="url(#stone)" stroke="#ddba75" stroke-width=".7"/>
  <path d="M24 46Q45 48 49 64M40 35Q61 42 62 66M58 29Q75 40 77 66M166 46Q145 48 141 64M150 35Q129 42 128 66M132 29Q115 40 113 66" stroke="#3e260f" stroke-width="3"/>
  <path d="M24 44Q45 46 49 62M40 33Q61 40 62 64M58 27Q75 38 77 64M166 44Q145 46 141 62M150 33Q129 40 128 64M132 27Q115 38 113 64" stroke="#e3be79" stroke-width="1.1"/>
