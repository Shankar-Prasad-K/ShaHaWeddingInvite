  <use href="#lotus" transform="translate(95 661) scale(.62)"/>
  <path d="M40 693H150L160 709H30Z" fill="url(#moulding)" stroke="#d1ac66"/>
  <rect x="26" y="709" width="138" height="13" fill="url(#beads)" stroke="#795021"/>
  <rect x="21" y="724" width="148" height="30" fill="url(#stone)" stroke="#d1aa65"/>
